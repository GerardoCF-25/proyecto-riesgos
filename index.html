<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page - Planes Anuales UNMSM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Configuración de color personalizado para que coincida con la solicitud */
        body {
            background-color: #E27B58; /* Color coral solicitado */
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* Estilos base para imágenes de reemplazo para mantener las proporciones */
        .placeholder-img {
            object-fit: cover;
            border: 2px solid transparent;
            transition: border-color 0.3s;
        }
        .placeholder-img:hover {
            border-color: #333;
        }
    </style>
</head>
<body class="py-8 px-4 w-full">

    <header class="w-full max-w-5xl flex flex-col items-center gap-4 mb-10">
        <!-- Banner Principal -->
        <div class="bg-[#FDF4E3] border-2 border-black w-full py-4 px-6 shadow-sm">
            <h1 class="text-black text-2xl md:text-3xl font-bold text-center tracking-wide">
                [.Plan Anual de Seguridad y Salud en el trabajo.]
            </h1>
        </div>
        
        <!-- Banner Secundario -->
        <div class="bg-[#FDF4E3] py-2 px-8 shadow-sm">
            <h2 class="text-black text-lg md:text-xl font-medium text-center uppercase tracking-wider">
                "UNIVERSIDAD NACIONAL MAYOR DE SAN MARCOS"
            </h2>
        </div>
    </header>

    <main class="w-full max-w-6xl flex flex-col md:flex-row justify-center items-center md:items-stretch gap-6 md:gap-4 lg:gap-8">
        
        <!-- COLUMNA IZQUIERDA: SST -->
        <div class="flex flex-col items-center w-full md:w-1/3 p-2">
            <!-- Placeholder Logo UNMSM -->
            <div class="bg-[#FDF4E3] p-2 mb-6 shadow-md w-[200px] h-[250px] flex items-center justify-center">
                <img src="logo_unmsm.png" alt="Logo UNMSM" class="w-full h-full object-contain placeholder-img">
            </div>

            <!-- Ícono de Documento SST (Generado con SVG para coincidir con la imagen) -->
            <div class="mb-8 relative w-[160px] h-[200px] bg-[#FDF4E3] p-3 shadow-md flex items-center justify-center border-4 border-black rounded-sm">
                <!-- Icono de documento -->
                <svg width="100" height="140" viewBox="0 0 100 140" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="5" y="5" width="40" height="40" stroke="black" stroke-width="6"/>
                    <line x1="60" y1="15" x2="95" y2="15" stroke="black" stroke-width="6"/>
                    <line x1="60" y1="35" x2="95" y2="35" stroke="black" stroke-width="6"/>
                    <line x1="5" y1="65" x2="95" y2="65" stroke="black" stroke-width="6"/>
                    <line x1="5" y1="85" x2="95" y2="85" stroke="black" stroke-width="6"/>
                    <line x1="5" y1="105" x2="60" y2="105" stroke="black" stroke-width="6"/>
                    <line x1="5" y1="125" x2="50" y2="125" stroke="black" stroke-width="6"/>
                </svg>
                <div class="absolute -right-3 -top-3 w-[60px] h-[60px] bg-white border-4 border-black rounded-bl-3xl"></div>
                <!-- Sello Checkmark Azul -->
                <div class="absolute -bottom-4 -right-4 w-16 h-16 bg-[#6B8AC9] border-4 border-black rounded-full flex items-center justify-center">
                    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FDF4E3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </div>
            </div>

            <!-- Botones y Textos Inferiores (Alineados al fondo usando mt-auto) -->
            <div class="mt-auto flex flex-col items-center gap-2 w-full max-w-[220px]">
                <div class="bg-[#FDF4E3] py-2 px-4 w-full text-center shadow-sm">
                    <p class="text-black font-semibold">Plan Anual de SST</p>
                </div>
                <a href="seguridad.html" class="bg-white border-2 border-black py-2 px-4 w-full text-center text-sm hover:bg-gray-100 transition-colors cursor-pointer text-black font-medium text-balance">
                    Clic para revisar el plan sst
                </a>
            </div>
        </div>

        <!-- COLUMNA CENTRAL: Foto y Grupo -->
        <div class="flex flex-col items-center justify-between w-full md:w-1/3 p-2 min-h-[500px]">
            <!-- Placeholder Foto de Grupo -->
            <div class="w-full max-w-[350px] shadow-lg border-4 border-white mt-4 md:mt-10">
                <img src="foto_grupal.png" alt="Foto del Grupo 5" class="w-full h-auto placeholder-img block">
            </div>

            <!-- Caja Grupo N 5 (Alineado con las cajas inferiores) -->
            <div class="mt-auto bg-[#FDF4E3] py-3 px-8 w-full max-w-[250px] shadow-sm mb-4">
                <h3 class="text-black text-xl font-bold text-center tracking-wide">
                    [.Grupo N 5.]
                </h3>
            </div>
        </div>

        <!-- COLUMNA DERECHA: Ambiental -->
        <div class="flex flex-col items-center w-full md:w-1/3 p-2">
            <!-- Placeholder Logo FII -->
            <div class="bg-white p-2 mb-6 shadow-md w-[200px] h-[250px] flex items-center justify-center">
                <img src="logo_fii.png" alt="Logo FII" class="w-full h-full object-contain placeholder-img">
            </div>

            <!-- Ícono de Documento Ambiental (Generado con SVG para coincidir con la imagen) -->
            <div class="mb-8 relative w-[160px] h-[200px] bg-white p-3 shadow-md flex items-center justify-center border-4 border-black rounded-sm">
                <!-- Icono de documento -->
                <svg width="100" height="140" viewBox="0 0 100 140" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="5" y="5" width="40" height="40" stroke="black" stroke-width="6"/>
                    <line x1="60" y1="15" x2="95" y2="15" stroke="black" stroke-width="6"/>
                    <line x1="60" y1="35" x2="95" y2="35" stroke="black" stroke-width="6"/>
                    <line x1="5" y1="65" x2="95" y2="65" stroke="black" stroke-width="6"/>
                    <line x1="5" y1="85" x2="95" y2="85" stroke="black" stroke-width="6"/>
                    <line x1="5" y1="105" x2="60" y2="105" stroke="black" stroke-width="6"/>
                    <line x1="5" y1="125" x2="50" y2="125" stroke="black" stroke-width="6"/>
                </svg>
                <div class="absolute -right-3 -top-3 w-[60px] h-[60px] bg-[#FDF4E3] border-4 border-black rounded-bl-3xl"></div>
                <!-- Sello Árbol Verde -->
                <div class="absolute -bottom-4 -right-4 w-16 h-16 bg-[#ADD8E6] border-4 border-black rounded-full flex items-center justify-center">
                    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 21V15M12 15C8.68629 15 6 12.3137 6 9C6 5.68629 8.68629 3 12 3C15.3137 3 18 5.68629 18 9C18 12.3137 15.3137 15 12 15Z" stroke="#228B22" stroke-width="3" stroke-linecap="round" fill="#228B22"/>
                        <path d="M12 21V15" stroke="#8B4513" stroke-width="4" stroke-linecap="round"/>
                    </svg>
                </div>
            </div>

            <!-- Botones y Textos Inferiores (Alineados al fondo usando mt-auto) -->
            <div class="mt-auto flex flex-col items-center gap-2 w-full max-w-[220px]">
                <div class="bg-[#FDF4E3] py-2 px-4 w-full text-center shadow-sm">
                    <p class="text-black font-semibold">Plan Anual Ambiental</p>
                </div>
                <a href="plan_ambiental.html" class="bg-white border-2 border-black py-2 px-4 w-full text-center text-sm hover:bg-gray-100 transition-colors cursor-pointer text-black font-medium text-balance">
                    Clic para revisar el plan ambiental
                </a>
            </div>
        </div>

    </main>
</body>
</html>
